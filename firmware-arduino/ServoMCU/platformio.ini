; Standalone PlatformIO project for the ServoMCU sketch.
; Flash with `pio run -t upload`.

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200

; Note: sketch drives servos via PCA9685 using Adafruit PWM Servo Driver.

lib_deps =
  adafruit/Adafruit PWM Servo Driver Library
